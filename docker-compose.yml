services:
  lanforge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lanforge_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/lanforge.db
      - NUXT_PUBLIC_APP_NAME=${NUXT_PUBLIC_APP_NAME:-LANSmith}
      - AUTO_SEED=${AUTO_SEED:-false}
      - SEED_HARDWARE=${SEED_HARDWARE:-false}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - NUXT_TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - NUXT_TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
    volumes:
      - lanforge_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lanforge_data:
    driver: local
